services:
  artemis-serve:
    build:
      context: .
      dockerfile: scripts/serve/Dockerfile.artemis-serve
    restart: unless-stopped
    environment:
      # Use the fine-tuned checkpoint if mounted, else pull gpt2 from HuggingFace.
      # Override with: ARTEMIS_MODEL_PATH=/app/checkpoint (and mount the checkpoint volume)
      - ARTEMIS_MODEL_PATH=${ARTEMIS_MODEL_PATH:-gpt2}
      - ARTEMIS_DEVICE=cpu
      - ARTEMIS_DTYPE=float32
      - ARTEMIS_PORT=8100
      - ARTEMIS_MAX_TOKENS=512
    expose:
      - "8100"
    volumes:
      - artemis_checkpoint:/app/checkpoint
      - hf_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8100/v1/status"]
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 120s

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    env_file: .env.production
    environment:
      - NODE_ENV=production
      - ARTEMIS_CORE_URL=http://artemis-serve:8100
    expose:
      - "8787"
    volumes:
      - artemis_data:/app/artemis-data
      - uploads:/app/uploaded
    depends_on:
      - artemis-serve
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    depends_on:
      - api

  gitea:
    image: gitea/gitea:1.22-rootless
    restart: unless-stopped
    environment:
      - GITEA__server__DOMAIN=${GITEA_DOMAIN:-git.cutline-industries.studio}
      - GITEA__server__ROOT_URL=https://${GITEA_DOMAIN:-git.cutline-industries.studio}/
      - GITEA__server__SSH_DOMAIN=${GITEA_DOMAIN:-git.cutline-industries.studio}
      - GITEA__server__SSH_PORT=2222
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__database__PATH=/data/gitea/gitea.db
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__service__DISABLE_REGISTRATION=${GITEA_DISABLE_REGISTRATION:-true}
      - GITEA__webhook__ALLOWED_HOST_LIST=deploy-agent
    expose:
      - "3000"
    ports:
      - "2222:2222"
    volumes:
      - gitea_data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

  deploy-agent:
    build:
      context: .
      dockerfile: infra/Dockerfile.deploy-agent
    restart: unless-stopped
    environment:
      - DEPLOY_SECRET=${DEPLOY_WEBHOOK_SECRET}
      - REPO_DIR=/srv/repo
      - COMPOSE_PROJECT=${COMPOSE_PROJECT_NAME:-cutline}
    expose:
      - "9000"
    volumes:
      - /srv/cutline-industries:/srv/repo
      - /var/run/docker.sock:/var/run/docker.sock

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
      - gitea
      - deploy-agent

volumes:
  artemis_data:
  artemis_checkpoint:
  hf_cache:
  uploads:
  caddy_data:
  caddy_config:
  gitea_data:
