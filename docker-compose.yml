services:
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    env_file: .env.production
    environment:
      - NODE_ENV=production
    expose:
      - "8787"
    volumes:
      - artemis_data:/app/artemis-data
      - uploads:/app/uploaded
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

volumes:
  artemis_data:
  uploads:
  caddy_data:
  caddy_config:
