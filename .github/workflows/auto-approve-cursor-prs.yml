name: Auto-approve Cursor PRs

# After verification succeeds on a cursor/* PR: mark ready, approve, squash-merge.
# One-time repo setup: docs/PR-AUTO-APPROVE.md

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: auto-approve-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  gate:
    name: Verify before auto-merge
    if: startsWith(github.head_ref, 'cursor/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  approve_and_merge:
    name: Approve and merge
    needs: gate
    if: startsWith(github.head_ref, 'cursor/')
    runs-on: ubuntu-latest
    steps:
      - name: Ready + approve + squash merge
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [ -n "${{ secrets.AUTO_APPROVE_TOKEN }}" ]; then
            export GH_TOKEN="${{ secrets.AUTO_APPROVE_TOKEN }}"
          else
            export GH_TOKEN="${{ github.token }}"
          fi

          echo "Processing PR #$PR (head: ${GITHUB_HEAD_REF:-unknown})"

          gh pr ready "$PR" 2>/dev/null || true

          gh pr review "$PR" --approve --body "Auto-approved: verification passed on \`cursor/*\` branch (Cutline Industries)." \
            || echo "Approve step skipped (already approved or policy blocked)."

          if gh pr merge "$PR" --squash --delete-branch; then
            echo "Merged PR #$PR"
          else
            echo "Direct merge failed — trying auto-merge"
            gh pr merge "$PR" --squash --auto --delete-branch \
              || { echo "::error::Could not merge PR #$PR. See docs/PR-AUTO-APPROVE.md"; exit 1; }
          fi
