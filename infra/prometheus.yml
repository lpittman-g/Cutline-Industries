global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: gitea
    static_configs:
      - targets: ["gitea:3000"]
    metrics_path: /metrics
    bearer_token: "${GITEA_METRICS_TOKEN}"

  - job_name: api
    static_configs:
      - targets: ["api:8787"]
    metrics_path: /api/metrics

  - job_name: caddy
    static_configs:
      - targets: ["caddy:2019"]
    metrics_path: /metrics

  - job_name: artemis
    static_configs:
      - targets: ["artemis-serve:8100"]
    metrics_path: /v1/metrics

  - job_name: minio
    static_configs:
      - targets: ["minio:9000"]
    metrics_path: /minio/v2/metrics/cluster
